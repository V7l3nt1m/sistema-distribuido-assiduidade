# Gateway
spring.application.name=api-gateway
server.port=8085

# Rota para Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Rota para Assiduidade Service
spring.cloud.gateway.server.webmvc.routes[1].id=assiduidade-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/assiduidade/**

# Rota para Funcion\u00e1rio Service
spring.cloud.gateway.server.webmvc.routes[2].id=funcionario-servico
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/funcionarios/**