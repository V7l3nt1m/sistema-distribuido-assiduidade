<div class="login-container">
  <div class="login-card">

    <img src="" alt="">
    <h1>Bem-vindo!</h1>
    <p>Entra na tua conta para continuar.</p>

    <form (ngSubmit)="iniciarSessao()"> <!--vai executar a funcao iniciarSessao no component typescript-->
      <div class="form-group">
        <label for="username">Username</label> <!--vai usar ngModel para passar os dados na funcao e tratar os dados-->
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username" 
          placeholder="Nome de usuario"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Palavra-passe</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Introduz a tua palavra-passe"
          required
        >
      </div>

      <button type="submit">Iniciar sessão</button>
    </form>

  </div>
</div>
